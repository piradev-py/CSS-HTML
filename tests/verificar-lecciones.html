<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar lecciones · &lt;CSS-HTML&gt;</title>
  <link rel="stylesheet" href="../css/tema.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <style>
    main { width: min(1000px, 100%); margin: 0 auto; padding: 24px 16px; }
    .resumen { font-size: 1.3rem; font-weight: 900; margin: 12px 0 20px; }
    table { width: 100%; border-collapse: collapse; background: var(--superficie); border-radius: 12px; overflow: hidden; }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--borde); text-align: left; vertical-align: top; font-size: 0.95rem; }
    th { background: var(--superficie-2); }
    .ok { color: var(--exito); font-weight: 900; }
    .mal { color: var(--error); font-weight: 900; }
    ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Verificación de lecciones</h1>
    <p>Para cada lección lista comprueba que: la estructura cumple el formato, la <b>solución</b> pasa todas las
      comprobaciones y el código <b>inicial</b> falla al menos una.</p>
    <div class="resumen" data-resumen>Comprobando…</div>
    <table>
      <thead><tr><th>Lección</th><th>Formato</th><th>Solución</th><th>Inicial</th><th>Ejercicios</th><th>Detalles</th></tr></thead>
      <tbody data-filas></tbody>
    </table>
  </main>

  <script src="../js/textos.js"></script>
  <script src="../js/curso.js"></script>
  <script src="../js/progreso.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/escritura.js"></script>
  <script src="../js/retos.js"></script>
  <script src="../js/pruebas.js"></script>
  <script src="../js/ejercicios.js"></script>
  <script>
    (async function () {
      const filas = document.querySelector("[data-filas]");
      const resumen = document.querySelector("[data-resumen]");
      const listas = CURSO.listaPlana().filter(l => l.listo);
      const marco = document.createElement("iframe");
      marco.style.cssText = "position:absolute;left:-10000px;width:800px;height:600px;";
      document.body.appendChild(marco);

      function cargar(l) {
        // Las lecciones de proyecto necesitan antes las versiones oficiales de «Huellas», en su idioma (las usan al cargarse)
        const huellas = CURSO.rutaHuellas(l.id);
        if (l.huellas && window.__huellas !== huellas) return cargarRuta("../" + huellas).then(ok => { window.__huellas = huellas; return ok && cargar(l); });
        return cargarRuta(CURSO.ruta(l.id, "../"));
      }
      function cargarRuta(ruta) {
        return new Promise(res => {
          const s = document.createElement("script");
          s.src = ruta;
          s.onload = () => res(true);
          s.onerror = () => res(false);
          document.body.appendChild(s);
        });
      }

      function revisarFormato(l, lec) {
        const errores = [];
        if (!lec) return ["El archivo no llama a CURSO.registrar con id " + l.id];
        if (lec.titulo !== l.titulo) errores.push("Título distinto al del índice: «" + lec.titulo + "»");
        if (!lec.objetivo) errores.push("Falta objetivo");
        if (!Array.isArray(lec.pasos) || !lec.pasos.length) return errores.concat("No tiene pasos");
        const retos = lec.pasos.filter(p => p.tipo === "reto");
        const proyectos = lec.pasos.filter(p => p.tipo === "proyecto");
        // Una lección de proyecto acaba con su último encargo y no lleva reto
        const final = proyectos.length ? "proyecto" : "reto";
        if (proyectos.length && retos.length) errores.push("Una lección de proyecto no lleva reto (tiene " + retos.length + ")");
        if (!proyectos.length && retos.length !== 1) errores.push("Debe tener exactamente 1 reto (tiene " + retos.length + ")");
        if (lec.pasos[lec.pasos.length - 1].tipo !== final) errores.push("El último paso no es el " + final);
        const tipos = ["explicacion", "pruebalo", "ejercicio", "controles", "quiz", "reto", "proyecto"];
        lec.pasos.forEach((p, i) => {
          if (!tipos.includes(p.tipo)) errores.push("Paso " + (i + 1) + ": tipo desconocido «" + p.tipo + "»");
          if (p.tipo === "quiz" && !(p.correcta >= 0 && p.correcta < (p.opciones || []).length)) errores.push("Paso " + (i + 1) + ": 'correcta' fuera de rango");
          if (p.tipo === "controles" && !(p.controles || []).length) errores.push("Paso " + (i + 1) + ": controles vacíos");
          if (p.tipo === "ejercicio" && (!p.enunciado || !p.solucion)) errores.push("Paso " + (i + 1) + ": ejercicio sin enunciado o sin solución");
        });
        // Glosario: cada término con su tema y su línea; el ejemplo, bien escrito (el alumno lo copia)
        (lec.glosario || []).forEach(t => {
          if (!t.termino || !t.tema || !t.para) errores.push("Glosario: término incompleto («" + (t.termino || "?") + "»)");
          const lenguaje = t.lenguaje || (l.mundo.clave === "js" ? "js" : /^\s*</.test(t.ejemplo || "") ? "html" : "css");
          const esc = t.ejemplo && ESCRITURA.revisar({ [lenguaje]: t.ejemplo });
          if (esc) errores.push("Glosario, «" + t.termino + "»: ejemplo mal escrito: " + esc.mensaje);
        });
        retos.concat(proyectos).forEach(r => {
          const n = (r.comprobaciones || []).length;
          const maximo = r.tipo === "proyecto" ? 12 : 5;
          if (n < 1 || n > maximo) errores.push("El " + r.tipo + " tiene " + n + " comprobaciones");
          if (!(r.pistas || []).length) errores.push("El " + r.tipo + " no tiene pistas");
          if (!r.solucion) errores.push("El " + r.tipo + " no tiene solución");
          (r.comprobaciones || []).forEach(c => {
            if (c.repaso && !CURSO.buscar(c.repaso)) errores.push("«" + c.texto + "»: repaso a una lección que no existe (" + c.repaso + ")");
          });
        });
        return errores;
      }

      let bien = 0;
      for (const l of listas) {
        const cargado = await cargar(l);
        const lec = CURSO.lecciones[l.id];
        const errores = cargado ? revisarFormato(l, lec) : ["No se pudo cargar " + CURSO.ruta(l.id)];
        let solOk = true, iniOk = true;
        const detalles = errores.slice();
        const examenes = (lec && lec.pasos || []).filter(p => p.tipo === "reto" || p.tipo === "proyecto");
        if (!examenes.length) solOk = iniOk = false;
        for (const reto of examenes) {
          if (!reto.solucion) { solOk = iniOk = false; continue; }
          const rSol = await RETOS.evaluar(EDITOR.conBase(reto.solucion, reto.cssBase, reto.proyecto), reto.comprobaciones, marco);
          if (!rSol.every(Boolean)) solOk = false;
          rSol.forEach((ok, i) => { if (!ok) detalles.push("La solución falla: «" + reto.comprobaciones[i].texto + "»"); });
          const erroresSol = marco.contentWindow.__errores || [];
          if (erroresSol.length) { solOk = false; detalles.push("La solución del reto tiene errores de JS: " + erroresSol.map(e => e.mensaje).join(" · ")); }
          // El motor añade a cada reto «Tu código está bien escrito»: la solución también debe cumplirlo
          const escSol = ESCRITURA.revisar(reto.solucion);
          if (escSol) { solOk = false; detalles.push("La solución del reto no está bien escrita: " + escSol.mensaje); }
          // Proyecto web: la misma web escrita de otra forma (otras etiquetas de agrupación, otras clases) también aprueba
          for (const [n, alt] of (reto.alternativas || []).entries()) {
            const rAlt = await RETOS.evaluar(EDITOR.conBase(alt, reto.cssBase, reto.proyecto), reto.comprobaciones, marco);
            rAlt.forEach((ok, i) => { if (!ok) { solOk = false; detalles.push("La alternativa " + (n + 1) + " falla: «" + reto.comprobaciones[i].texto + "»"); } });
          }
          const rIni = await RETOS.evaluar(EDITOR.conBase(reto.inicial || {}, reto.cssBase, reto.proyecto), reto.comprobaciones, marco);
          if (!rIni.some(r => !r)) { iniOk = false; detalles.push("El código inicial ya pasa todas las comprobaciones"); }
        }
        // Ejercicios: la solución aprueba y el editor inicial (vacío) suspende
        let ejOk = true;
        // Los ejemplos y el código que da la lección deben estar bien escritos (es lo que el alumno copia)
        (lec && lec.pasos || []).forEach((p, i) => {
          [["ejemplo", p.ejemplo], ["código inicial", p.inicial]].forEach(([que, cod]) => {
            const esc = cod && ESCRITURA.revisar(cod);
            if (esc) { ejOk = false; detalles.push("Paso " + (i + 1) + ", " + que + " mal escrito: " + esc.mensaje); }
          });
        });
        const ejercicios = (lec && lec.pasos || []).filter(p => p.tipo === "ejercicio");
        for (const ej of ejercicios) {
          const conSol = await EJERCICIOS.revisar(ej.solucion, ej.solucion, null, ej.cssBase, ej.acciones);
          if (!conSol.ok) { ejOk = false; detalles.push("Ejercicio: la solución no se aprueba a sí misma (" + conSol.mensaje + ")"); }
          const conIni = await EJERCICIOS.revisar(Object.assign({ html: "", css: "", js: "" }, ej.inicial), ej.solucion, null, ej.cssBase, ej.acciones);
          if (conIni.ok) { ejOk = false; detalles.push("Ejercicio: el código inicial ya está resuelto"); }
          if ((ej.solucion.js || "").trim()) {
            const v = await PRUEBA.cargarEn(marco, EDITOR.construirDocumento(EDITOR.conBase(ej.solucion, ej.cssBase)), {});
            const errs = v.win.__errores || [];
            if (errs.length) { ejOk = false; detalles.push("Ejercicio: la solución tiene errores de JS: " + errs.map(e => e.mensaje).join(" · ")); }
            for (const acc of ej.acciones || []) {
              const sel = acc.clic || acc.escribir || acc.elegir || acc.enviar;
              if (!sel || !v.doc.querySelector(sel)) { ejOk = false; detalles.push("Ejercicio: la acción apunta a «" + sel + "», que no existe en la solución"); }
            }
          }
        }
        const todo = !errores.length && solOk && iniOk && ejOk;
        if (todo) bien++;
        const tr = document.createElement("tr");
        const celda = ok => '<td class="' + (ok ? "ok" : "mal") + '">' + (ok ? "✓" : "✗") + "</td>";
        tr.innerHTML = "<td><b>" + l.id + "</b><br>" + UI.escapar(l.titulo) + "</td>" +
          celda(!errores.length) + celda(solOk) + celda(iniOk) + (ejercicios.length ? celda(ejOk) : "<td>—</td>") +
          "<td>" + (detalles.length ? "<ul>" + detalles.map(d => "<li>" + UI.escapar(d) + "</li>").join("") + "</ul>" : "—") + "</td>";
        filas.appendChild(tr);
      }
      resumen.innerHTML = (bien === listas.length ? "✅ " : "❌ ") + bien + " de " + listas.length + " lecciones correctas";
      resumen.className = "resumen " + (bien === listas.length ? "ok" : "mal");
      document.title = (bien === listas.length ? "✓ " : "✗ ") + document.title;
    })();
  </script>
</body>
</html>
