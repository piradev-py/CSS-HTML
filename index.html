<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&lt;CSS-HTML&gt; · Aprende a crear webs jugando</title>
  <meta name="description" content="Curso interactivo y gratuito de HTML, CSS y JavaScript para principiantes, con retos, XP e insignias.">
  <link rel="icon" href="recursos/marca/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="recursos/marca/tagui-logo-160.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Concert+One&family=JetBrains+Mono:wght@400;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
  <!-- ?v=: versión del curso (node herramientas/version.mjs), para que el navegador no use archivos viejos -->
  <link rel="stylesheet" href="css/tema.css?v=1.1.5">
  <link rel="stylesheet" href="css/componentes.css?v=1.1.5">
  <link rel="stylesheet" href="css/mapa.css?v=1.1.5">
</head>
<body>
  <header class="cabecera"></header>

  <!-- En horizontal: insignias en una columna a la izquierda y el mapa a la derecha -->
  <div class="inicio">
    <aside class="seccion-insignias" aria-labelledby="titulo-insignias">
      <h2 id="titulo-insignias">🏅 Tus insignias <span class="contador-insignias" data-contador-insignias></span></h2>
      <div class="rejilla-insignias" data-insignias></div>
    </aside>

    <main class="contenido">
      <section class="bienvenida" data-bienvenida></section>

      <div data-mundos></div>

      <section class="opciones-curso tarjeta" data-opciones-curso></section>
    </main>
  </div>

  <footer class="pie">
    Hecho con 🧡 para quien empieza desde cero · Tu progreso se guarda en este navegador · Versión <span data-version></span>
  </footer>

  <script src="js/curso.js?v=1.1.5"></script>
  <script src="js/progreso.js?v=1.1.5"></script>
  <script src="js/celebracion.js?v=1.1.5"></script>
  <script src="js/mascota.js?v=1.1.5"></script>
  <script src="js/ui.js?v=1.1.5"></script>
  <script src="js/sugerencias.js?v=1.1.5"></script>
  <script src="js/mapa.js?v=1.1.5"></script>
</body>
</html>
